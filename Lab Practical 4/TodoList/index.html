<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 p-4 rounded-4">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Task Manager</h2>
                        <p class="text-muted small">Organize your tasks and stay productive.</p>
                    </div>

                    <div class="input-group mb-3">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="New task">
                        <button class="btn btn-primary px-4" type="button" id="addTaskBtn">Add Task</button>
                    </div>
                    <div id="errorMsg" class="text-danger small mb-3" style="display: none;"></div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-secondary fw-semibold small">Your tasks:</span>
                        <span id="taskCounter" class="badge bg-primary">0 remaining</span>
                    </div>

                    <div class="btn-group w-100 mb-4 shadow-sm" role="group" aria-label="Task Filters">
                        <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                    </div>

                    <ul id="taskList" class="list-group mb-4">
                    </ul>

                    <div id="emptyState" class="text-center text-muted py-4">
                        No tasks yet. Add your first task!
                    </div>

                    <div class="text-end">
                        <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Clear Completed</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
