<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <h1>Personal Expense Tracker</h1>
  </nav>

  <main class="container">
    
    <section class="summary-cards">
      <div class="card income">
        <h3>Total Income</h3>
        <p id="total-income">LKR 0.00</p>
      </div>
      <div class="card expenses">
        <h3>Total Expenses</h3>
        <p id="total-expenses">LKR 0.00</p>
      </div>
      <div class="card balance">
        <h3>Current Balance</h3>
        <p id="current-balance">LKR 0.00</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Add New Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g., Monthly Allowance" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount (LKR)</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="e.g., 25000" required />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="e.g., Allowance, Food, Transport" required />
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Transaction</button>
          <button type="button" id="clear-btn" class="btn btn-secondary">Clear Form</button>
        </div>
      </form>
    </section>

    <section class="history-section">
      <div class="history-header">
        <h2>Transaction History</h2>
        <div class="filter-group">
          <label for="filter">Filter: </label>
          <select id="filter">
            <option value="All">All Transactions</option>
            <option value="Income">Income Only</option>
            <option value="Expense">Expenses Only</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Type</th>
              <th>Category</th>
              <th>Amount (LKR)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
